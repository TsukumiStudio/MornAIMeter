name: Release mac app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash build-app.sh

      - name: Zip app
        run: |
          cd build
          ditto -c -k --keepParent MornAIMeter.app MornAIMeter.app.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/MornAIMeter.app.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" build/MornAIMeter.app.zip --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
