name: Release mac app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash build-app.sh

      - name: Zip app
        run: |
          cd build
          ditto -c -k --keepParent MornAIMeter.app MornAIMeter.app.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/MornAIMeter.app.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" build/MornAIMeter.app.zip --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

      - name: Update Homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 build/MornAIMeter.app.zip | awk '{print $1}')"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/matsufriends/homebrew-tap.git" tap
          cd tap
          sed -i "" -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/mornaimeter.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/mornaimeter.rb
          git diff --cached --quiet || { git commit -m "mornaimeter ${VERSION}"; git push; }
