name: Release mac app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" bash build-app.sh

      - name: Sign & notarize via MornNotary
        env:
          # PAT (classic), repo scope, with access to matsufriends/MornNotary.
          GH_TOKEN: ${{ secrets.MORN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::MORN_RELEASE_TOKEN is not set. Register a PAT (classic) with repo scope and access to matsufriends/MornNotary."
            exit 1
          fi
          gh auth setup-git
          gh repo clone matsufriends/MornNotary "$RUNNER_TEMP/MornNotary" -- --depth 1
          if ! bash "$RUNNER_TEMP/MornNotary/sign.sh" build/MornAIMeter.app; then
            # shortcut: cleanup may fail without artifact-delete permission; fix the shared script when its token can clean up.
            test -f build/MornAIMeter-signed.zip
            ditto -x -k build/MornAIMeter-signed.zip "$RUNNER_TEMP/verified"
            codesign --verify --deep --strict "$RUNNER_TEMP/verified/MornAIMeter.app"
            xcrun stapler validate "$RUNNER_TEMP/verified/MornAIMeter.app"
            echo "::warning::MornNotary failed after producing a verified app; cleanup may be incomplete."
          fi
          mv build/MornAIMeter-signed.zip build/MornAIMeter.app.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/MornAIMeter.app.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" build/MornAIMeter.app.zip --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set. Register a token with access to TsukumiStudio/homebrew-tap (Contents: read/write)."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 build/MornAIMeter.app.zip | awk '{print $1}')"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/TsukumiStudio/homebrew-tap.git" tap
          cd tap
          sed -i "" -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/mornaimeter.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/mornaimeter.rb
          git diff --cached --quiet || { git commit -m "mornaimeter ${VERSION}"; git push; }
