name: Release mac app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      MORN_RELEASE_TOKEN: ${{ secrets.MORN_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" bash build-app.sh

      - name: Sign & notarize via MornNotary
        env:
          GH_TOKEN: ${{ secrets.MORN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::MORN_RELEASE_TOKEN secret is not set. Register a fine-grained PAT covering matsufriends/MornNotary and matsufriends/homebrew-tap (Contents: read/write, Actions: read) as MORN_RELEASE_TOKEN."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"

          SUBMIT_ZIP="$(mktemp -d)/MornAIMeter.zip"
          ditto -c -k --keepParent build/MornAIMeter.app "$SUBMIT_ZIP"

          WORKDIR="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/matsufriends/MornNotary.git" "$WORKDIR"
          cp "$SUBMIT_ZIP" "$WORKDIR/incoming/MornAIMeter.zip"
          cd "$WORKDIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add incoming/MornAIMeter.zip
          git commit -m "request: sign MornAIMeter v${VERSION}"
          git push
          SHA="$(git rev-parse HEAD)"

          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list --repo matsufriends/MornNotary --workflow sign.yml \
              --json databaseId,headSha --jq ".[] | select(.headSha==\"$SHA\") | .databaseId" | head -1)
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::MornNotary workflow run did not start for commit $SHA"
            exit 1
          fi
          echo "MornNotary run: $RUN_ID"
          gh run watch "$RUN_ID" --repo matsufriends/MornNotary --exit-status

          OUTDIR="$(mktemp -d)"
          gh run download "$RUN_ID" --repo matsufriends/MornNotary --name "MornAIMeter-signed" --dir "$OUTDIR"
          SIGNED_ZIP="$(find "$OUTDIR" -name '*.zip' | head -1)"
          if [ -z "$SIGNED_ZIP" ]; then
            echo "::error::Signed artifact not found in MornNotary run output"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          rm -rf build/MornAIMeter.app
          ditto -x -k "$SIGNED_ZIP" build
          codesign --verify --deep --strict --verbose=2 build/MornAIMeter.app
          xcrun stapler validate build/MornAIMeter.app

      - name: Zip app
        run: |
          cd build
          ditto -c -k --keepParent MornAIMeter.app MornAIMeter.app.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/MornAIMeter.app.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" build/MornAIMeter.app.zip --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

      - name: Update Homebrew tap
        if: ${{ env.MORN_RELEASE_TOKEN != '' }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 build/MornAIMeter.app.zip | awk '{print $1}')"
          git clone "https://x-access-token:${MORN_RELEASE_TOKEN}@github.com/matsufriends/homebrew-tap.git" tap
          cd tap
          sed -i "" -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/mornaimeter.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/mornaimeter.rb
          git diff --cached --quiet || { git commit -m "mornaimeter ${VERSION}"; git push; }
